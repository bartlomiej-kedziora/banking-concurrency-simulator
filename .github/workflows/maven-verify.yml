
name: Maven Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and verify
        run: mvn --batch-mode --no-transfer-progress verify
